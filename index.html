<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Vocabulary</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <nav class="app-bar">
        <div class="container">
            <h1 id="app-title">Editorial Vocabulary</h1>
            <div class="region-info" id="region-status">Detecting location...</div>
        </div>
    </nav>

    <main class="container">
        <!-- Tab Switcher -->
        <div class="tabs">
            <button id="tab-editorial" class="active">Editorials</button>
            <button id="tab-vocabulary">Vocabulary</button>
        </div>

        <!-- Content Area (Like a FrameLayout in Android) -->
        <div id="content-loader" class="loader" style="display: none;">Loading from GitLab...</div>
        <article id="content-view" class="markdown-body">
            <!-- Data from GitLab will be rendered here -->
        </article>
    </main>

    <footer class="bottom-nav">
        <a href="about.html">About Developer</a>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
