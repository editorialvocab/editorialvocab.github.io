<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Vocabulary</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <nav class="app-bar">
        <div class="container">
            <h1>Editorial Vocabulary</h1>
            <select id="region-picker" class="region-selector">
                <option value="IN">Hindi User</option>
                <option value="BD">BD User</option>
            </select>
        </div>
    </nav>

    <main class="container">
        <div id="region-status" style="font-size: 0.7rem; text-align: right; padding: 5px; color: var(--text-secondary);">
            Detecting location...
        </div>

        <div id="word-of-day-container"></div>

        <div class="tabs">
            <button id="tab-articles" class="active">Articles</button>
            <button id="tab-vocab">10 Daily Vocab</button>
            <button id="tab-quiz">Quiz</button>
        </div>

        <div id="loader" class="loader" style="display: none;">Fetching latest data...</div>
        
        <div id="main-content" class="content-card"></div>
    </main>

    <footer class="bottom-nav">
        <a href="about.html">About Developer</a>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
