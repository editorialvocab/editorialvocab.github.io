<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Received — Editorial Vocabulary</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0f1e">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;

            font-family: 'DM Sans', sans-serif;
            text-align: center;
            padding: 20px;

        .card { max-width: 460px; }

        .icon { font-size: 2.5rem; margin-bottom: 16px; }

            display: inline-block;
            margin-top: 24px;
            color: #0a0f1e;
            background: #c9a84c;
            padding: 11px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>Request received</h1>
        <p>Your account deletion request has been submitted. You'll receive a confirmation email, and your data will be deleted within 7 days.</p>
        <a href="https://editorialvocab.github.io/">Back to Editorial Vocabulary</a>
